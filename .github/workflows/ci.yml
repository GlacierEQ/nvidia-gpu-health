name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@main
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      verify_script: .github/verification/verify.sh
      upload_artifacts: false
